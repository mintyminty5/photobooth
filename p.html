<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FDFAF2">
<title>내 인생네컷 받기 · Minty Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#FDFAF2; --cream-2:#F5EDDF; --ink:#4A3B32; --ink-soft:#9C8B7C; --pink:#F4A3B4; --butter:#FBE08A; --line:#E6D9C6; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; min-height:100%;}
  body{background:var(--cream-2); color:var(--ink); font-family:'Gaegu', -apple-system, 'Apple SD Gothic Neo', cursive; font-size:17px;}
  .page{max-width:520px; min-height:100vh; min-height:100dvh; margin:0 auto; background:var(--cream);
        display:flex; flex-direction:column; align-items:center;
        padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));}
  h1{font-weight:700; font-size:32px; margin:6px 0 2px; text-align:center;}
  .sub{margin:0 0 14px; color:var(--ink-soft); font-size:16px; text-align:center;}
  .stage{width:100%; display:flex; flex-direction:column; align-items:center; flex:1;}
  #shot{width:min(78%, 280px); border-radius:8px; box-shadow:0 10px 26px rgba(74,59,50,.22); display:none; -webkit-touch-callout:default;}
  .loading,.gone{text-align:center; color:var(--ink-soft); line-height:1.7; padding:40px 10px;}
  .gone b{display:block; font-size:28px; color:var(--ink); margin-bottom:6px;}
  .tip{font-size:15px; color:var(--ink-soft); line-height:1.6; text-align:center; margin:14px 0 6px;}
  .left{font-size:15px; color:var(--ink-soft); margin:6px 0 0;}
  .msg{min-height:22px; font-size:16px; color:var(--ink); margin:6px 0 0; text-align:center;}
  .btn{width:100%; max-width:360px; min-height:58px; margin-top:14px; border-radius:20px;
       font-family:'Gaegu', cursive; font-weight:700; font-size:28px; background:var(--butter); color:var(--ink);
       border:2.5px solid var(--ink); box-shadow:0 4px 0 var(--ink); cursor:pointer; transition:transform .1s, box-shadow .1s;}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink);}
  .btn.ghost{background:#fff; border-color:var(--line); box-shadow:0 3px 0 var(--line); color:var(--ink-soft); font-size:22px; min-height:50px;}
  .foot{margin-top:auto; padding-top:22px; font-weight:700; font-size:16px; color:var(--ink-soft); letter-spacing:.5px; text-align:center; line-height:1.5;}
  .foot small{display:block; font-weight:400; font-size:14px; opacity:.85;}
</style>
</head>
<body>
<div class="page">
  <h1>내 인생네컷 🎀</h1>
  <p class="sub" id="sub">사진을 불러오는 중이에요</p>

  <div class="stage" id="stage">
    <div class="loading" id="loading">잠시만 기다려 주세요…</div>

    <img id="shot" alt="내 인생네컷">
    <p class="left" id="left"></p>
    <p class="msg" id="msg"></p>
    <button class="btn" id="saveBtn" style="display:none">💾 저장하기</button>
    <p class="tip" id="tip" style="display:none">저장이 안 되면 위 사진을 길게 눌러<br>‘이미지 저장’(사진에 추가)을 선택하세요.</p>

    <div class="gone" id="gone" style="display:none">
      <b>사진이 사라졌어요 🍃</b>
      QR 사진은 개인정보 보호를 위해<br>일정 시간이 지나면 자동으로 삭제돼요.<br>
      (친구에게 다시 받거나, 새로 찍어 주세요)
    </div>
    <button class="btn ghost" id="againBtn" style="display:none" onclick="location.href='/'">📸 나도 찍어보기</button>
  </div>

  <div class="foot">🌿 made in Minty Lab<small>기획·시나리오 Minty.E / 개발 Minty Lab</small></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const id = location.pathname.split('/').filter(Boolean).pop() || '';
  let blob = null, expiresAt = 0, timer = null;

  function fileName(){
    const d = new Date(), z = n => String(n).padStart(2,'0');
    return `인생네컷_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.jpg`;
  }
  function tell(t){ $('msg').textContent = t; }

  function showGone(){
    $('loading').style.display = 'none';
    $('shot').style.display = 'none';
    $('saveBtn').style.display = 'none';
    $('tip').style.display = 'none';
    $('left').textContent = '';
    $('gone').style.display = 'block';
    $('againBtn').style.display = 'block';
    $('sub').textContent = '만료된 사진이에요';
    clearInterval(timer);
  }

  function tick(){
    const ms = expiresAt - Date.now();
    if(ms <= 0){ showGone(); return; }
    const m = Math.ceil(ms/60000);
    $('left').textContent = m >= 60 ? `약 ${Math.round(m/60)}시간 뒤에 자동 삭제돼요` : `${m}분 뒤에 자동 삭제돼요`;
  }

  async function load(){
    if(!/^[A-Za-z0-9_-]{22}$/.test(id)){ showGone(); return; }
    try{
      const r = await fetch('/api/photo/' + id, {cache:'no-store'});
      if(!r.ok){ showGone(); return; }
      expiresAt = Number(r.headers.get('x-expires-at')) || 0;
      blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const img = $('shot');
      img.src = url; img.style.display = 'block';
      $('loading').style.display = 'none';
      $('saveBtn').style.display = 'block';
      $('tip').style.display = 'block';
      $('againBtn').style.display = 'block';
      $('sub').textContent = '완성된 사진이에요!';
      if(expiresAt){ tick(); timer = setInterval(tick, 30000); }
    }catch(e){
      $('loading').innerHTML = '사진을 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 열어 주세요.';
    }
  }

  // 버튼을 누른 순간 바로 저장 동작 (사파리 제한 때문에 미리 받아둔 blob 사용)
  $('saveBtn').onclick = function(){
    if(!blob){ tell('잠시만요, 준비 중이에요'); return; }
    const file = new File([blob], fileName(), {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'인생네컷'})
        .catch(err => { if(err && err.name !== 'AbortError') download(); });
      return;
    }
    download();
  };
  function download(){
    try{
      const a = document.createElement('a');
      a.href = $('shot').src; a.download = fileName(); a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      tell('저장했어요! 갤러리나 다운로드 폴더를 확인해 주세요');
    }catch(e){ tell('사진을 길게 눌러 저장해 주세요'); }
  }

  load();
})();
</script>
</body>
</html>
